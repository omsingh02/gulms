name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Please run `gulms doctor` first; it solves many problems.
        **Never paste your token, password, or `config.json`.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, and what did you expect instead?
      placeholder: "I ran `gulms export DBMS 3` and ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gulms doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full error output
      description: The complete text of any error message.
      render: text
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: "`gulms --version`, plus your OS (e.g. Windows 11, macOS 15, Ubuntu 24.04)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Install script, Prebuilt binary download, cargo install, Built from source]
