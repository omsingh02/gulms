name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything exactly like a release, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A real tag when releasing; a placeholder for dry runs started by hand.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package
        shell: bash
        run: scripts/package.sh "$TAG" "${{ matrix.target }}" "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum gulms-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo 'On Windows: `irm https://raw.githubusercontent.com/'"${GITHUB_REPOSITORY}"'/main/install.ps1 \| iex`'
            echo
            echo "Verify any download against \`SHA256SUMS\`."
          } >> notes.md

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --title "gulms ${TAG}" \
            --notes-file notes.md \
            --verify-tag

      - name: Dry run summary
        if: github.ref_type != 'tag'
        run: |
          echo "Dry run: nothing was published. These files would have been attached:"
          ls -la dist
