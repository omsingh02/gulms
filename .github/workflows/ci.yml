name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  installers:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/package.sh

      - name: Build a fake release
        shell: bash
        run: |
          scripts/package.sh v0.0.0-ci "${{ matrix.target }}" "${{ matrix.archive }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum gulms-* > SHA256SUMS; else shasum -a 256 gulms-* > SHA256SUMS; fi
          cat SHA256SUMS

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          GULMS_BASE_URL="file://$PWD/dist" GULMS_VERSION=v0.0.0-ci GULMS_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/gulms" --version
          "$RUNNER_TEMP/bin/gulms" doctor --offline || true

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GULMS_BASE_URL = "$PWD\dist"
          $env:GULMS_VERSION = 'v0.0.0-ci'
          $env:GULMS_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          & "$env:RUNNER_TEMP\bin\gulms.exe" --version
